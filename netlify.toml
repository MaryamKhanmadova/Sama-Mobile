# The frontend lives in frontend/. Netlify reads this root file, switches to the base
# directory and uses the same build settings as frontend/netlify.toml.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[build.environment]
  VITE_DATA_MODE = "api"
  VITE_API_AUTH = "proxy"
  VITE_API_BASE_URL = "/api"
  VITE_CHAT_TRANSPORT = "sse"

[[headers]]
  for = "/avatar/maryam.glb"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/avatar/preview.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
