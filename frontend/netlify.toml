[build]
  command = "npm run build"
  publish = "dist"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[build.environment]
  VITE_DATA_MODE = "api"
  VITE_API_AUTH = "proxy"
  VITE_API_BASE_URL = "/api"
  VITE_CHAT_TRANSPORT = "sse"
